name: Run Python Scripts → Google Sheets (daily)

on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC = 10:30 IST
  workflow_dispatch:

permissions:
  contents: read

env:
  GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}

jobs:
  run-and-write:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y jq

      - name: Prepare service account credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > sa.json

      - name: Discover & run scripts (robust capture, 120s timeout, multiline-safe)
        id: run_all
        shell: bash
        run: |
          set -euo pipefail

          # Find scripts
          if ! ls -1 scripts/*.py >/dev/null 2>&1; then
            echo "No scripts found in scripts/*.py — nothing to do."
            : > results.jsonl
            exit 0
          fi

          : > results.jsonl

          for f in scripts/*.py; do
            base="$(basename "$f")"
            name="${base%.py}"
            echo "==> Running $base"

            out_file="$(mktemp)"
            err_file="$(mktemp)"

            # Run with 120s hard timeout, capture both streams
            set +e
            timeout 120s python "$f" >"$out_file" 2>"$err_file"
            code=$?
            set -e

            if [ $code -ne 0 ]; then
              echo "    ❌ $base exited with code $code"
              echo "    --- stderr (first 50 lines) ---"
              sed -n '1,50p' "$err_file" || true
              echo "    --- end stderr ---"
              continue
            fi

            # Read stdout; allow multi-line JSON; compact with jq -c
            if [ ! -s "$out_file" ]; then
              echo "    ⚠️  $base produced empty stdout; skipping."
              continue
            fi

            if jq -e . < "$out_file" >/dev/null 2>&1; then
              compact="$(jq -c . < "$out_file")"
              # Store as JSONL: {name, json}
              jq -n --arg name "$name" --arg raw "$compact" '{name:$name, json:$raw}' >> results.jsonl
              echo "    ✅ captured JSON for $base"
            else
              echo "    ⚠️  $base stdout is not valid JSON; skipping."
              echo "    --- stdout (first 50 lines) ---"
              sed -n '1,50p' "$out_file" || true
              echo "    --- end stdout ---"
              echo "    --- stderr (first 20 lines) ---"
              sed -n '1,20p' "$err_file" || true
              echo "    --- end stderr ---"
              continue
            fi
          done

          echo "Run complete."

      - name: Write to Google Sheets (prepend rows; retry once on failure)
        env:
          GOOGLE_SPREADSHEET_ID: ${{ env.GOOGLE_SPREADSHEET_ID }}
        run: |
          python tools/sheets_writer.py \
            --service-account-json sa.json \
            --spreadsheet-id "$GOOGLE_SPREADSHEET_ID" \
            --results-file results.jsonl
